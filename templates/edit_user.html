<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ویرایش کاربر | جابامن</title>
    <link rel="icon" type="image/svg+xml" href="/static/images/favicon.svg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="main-header">
    <div class="header-container">
        <a href="/" class="logo">
            <img src="/static/images/logo.svg" class="logo-img" alt="جابامن">
        </a>
        <nav class="main-nav">
            {% if user_id %}
            <a href="/admin"><i class="fas fa-tachometer-alt"></i> داشبورد</a>
            <a href="/admin/users"><i class="fas fa-users"></i> کاربران</a>
            <a href="/admin/properties"><i class="fas fa-building"></i> اقامتگاه‌ها</a>
            <a href="/admin/reservations"><i class="fas fa-calendar-check"></i> رزروها</a>
            <a href="/admin/comments"><i class="fas fa-comments"></i> نظرات</a>
            <a href="/admin/messages"><i class="fas fa-envelope"></i> پیام‌ها</a>
            <a href="/" class="btn-ghost btn-sm"><i class="fas fa-globe"></i> مشاهده سایت</a>
            <a href="/logout" class="btn-primary btn-sm"><i class="fas fa-sign-out-alt"></i> خروج</a>
            {% else %}
            <a href="/register" class="btn-outline btn-sm">ثبت‌نام</a>
            <a href="/login" class="btn-primary btn-sm">ورود</a>
            {% endif %}
        </nav>
    </div>
</header>

<main>
<div class="register-container">
    <div class="page-header">
        <h1>ویرایش کاربر</h1>
        <p>اطلاعات کاربر را به‌روزرسانی کنید</p>
    </div>
    <div class="register-card">
        <div class="register-header">
            <i class="fas fa-user-edit"></i>
            <h2>فرم ویرایش کاربر</h2>
        </div>
        <form method="POST" action="/admin/users/{{ user.id }}/edit" class="register-form">
            <div class="form-row">
                <div class="form-group">
                    <label>نام <span class="required-star">*</span></label>
                    <input type="text" name="first_name" class="form-control" value="{{ user.first_name }}" required>
                </div>
                <div class="form-group">
                    <label>نام خانوادگی <span class="required-star">*</span></label>
                    <input type="text" name="last_name" class="form-control" value="{{ user.last_name }}" required>
                </div>
            </div>
            <div class="form-group">
                <label>ایمیل <span class="required-star">*</span></label>
                <input type="email" name="email" class="form-control" value="{{ user.email }}" required>
            </div>
            <div class="form-group">
                <label>شماره موبایل (اختیاری)</label>
                <input type="tel" name="phone" class="form-control" value="{{ user.phone }}">
            </div>
            <div class="form-group">
                <label>نوع حساب <span class="required-star">*</span></label>
                <select name="account_type" class="form-control" required>
                    <option value="guest" {% if user.account_type == 'guest' %}selected{% endif %}>مهمان</option>
                    <option value="host" {% if user.account_type == 'host' %}selected{% endif %}>میزبان</option>
                </select>
            </div>
            <button type="submit" class="submit-btn">
                <i class="fas fa-save"></i> ذخیره تغییرات
            </button>
        </form>
    </div>
    <p class="text-center" style="margin-top:1.5rem;">
        <a href="/admin/users" class="btn-ghost"><i class="fas fa-arrow-right"></i> بازگشت به لیست کاربران</a>
    </p>
</div>
</main>

<footer class="main-footer">
    <div class="footer-bottom">
        <p>© ۱۴۰۴ جابامن — تمام حقوق محفوظ است.</p>
    </div>
</footer>

<script src="/static/js/main.js"></script>
</body>
</html>
