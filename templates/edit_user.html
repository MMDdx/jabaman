<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ویرایش کاربر</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="register-container">
    <div class="page-header">
        <h1>ویرایش کاربر</h1>
    </div>
    <div class="register-card">
        <div class="register-header">
            <i class="fas fa-user-edit"></i>
            <h2>فرم ویرایش</h2>
        </div>
        <form method="POST" action="/admin/users/{{ user.id }}/edit" class="register-form">
            <div class="form-row">
                <div class="form-group">
                    <label>نام <span class="required-star">*</span></label>
                    <input type="text" name="first_name" class="form-control" value="{{ user.first_name }}" required>
                </div>
                <div class="form-group">
                    <label>نام خانوادگی <span class="required-star">*</span></label>
                    <input type="text" name="last_name" class="form-control" value="{{ user.last_name }}" required>
                </div>
            </div>
            <div class="form-group">
                <label>شماره موبایل <span class="required-star">*</span></label>
                <input type="tel" name="phone" class="form-control" value="{{ user.phone }}" required pattern="[0-9]{10,11}">
            </div>
            <div class="form-group">
                <label>نوع حساب <span class="required-star">*</span></label>
                <select name="account_type" class="form-control" required>
                    <option value="guest" {% if user.account_type == 'guest' %}selected{% endif %}>مهمان</option>
                    <option value="host" {% if user.account_type == 'host' %}selected{% endif %}>میزبان</option>
                </select>
            </div>
            <button type="submit" class="submit-btn">ذخیره تغییرات</button>
        </form>
    </div>
    <p style="text-align:center;margin-top:1rem;"><a href="/admin/users">بازگشت به لیست</a></p>
</div>
</body>
</html>
