<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ویرایش اقامتگاه | جابامن</title>
    <link rel="icon" type="image/svg+xml" href="/static/images/favicon.svg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="main-header">
    <div class="header-container">
        <a href="/" class="logo">
            <img src="/static/images/logo.svg" class="logo-img" alt="جابامن">
        </a>
        <nav class="main-nav">
            {% if user_id %}
            <a href="/admin"><i class="fas fa-tachometer-alt"></i> داشبورد</a>
            <a href="/admin/users"><i class="fas fa-users"></i> کاربران</a>
            <a href="/admin/properties"><i class="fas fa-building"></i> اقامتگاه‌ها</a>
            <a href="/admin/comments"><i class="fas fa-comments"></i> نظرات</a>
            <a href="/admin/messages"><i class="fas fa-envelope"></i> پیام‌ها</a>
            <a href="/" class="btn-ghost btn-sm"><i class="fas fa-globe"></i> مشاهده سایت</a>
            <a href="/logout" class="btn-primary btn-sm"><i class="fas fa-sign-out-alt"></i> خروج</a>
            {% else %}
            <a href="/register" class="btn-outline btn-sm">ثبت‌نام</a>
            <a href="/login" class="btn-primary btn-sm">ورود</a>
            {% endif %}
        </nav>
    </div>
</header>

<main>
<div class="add-listing-container">
    <div class="page-header">
        <h1>ویرایش اقامتگاه</h1>
        <p>اطلاعات اقامتگاه را به‌روزرسانی کنید</p>
    </div>
    <div class="form-card">
        <div class="form-header">
            <i class="fas fa-edit"></i>
            <h2>فرم ویرایش اقامتگاه</h2>
        </div>
        <form method="POST" action="/admin/properties/{{ property.id }}/edit" class="listing-form">
            <div class="form-group">
                <label>عنوان <span class="required-star">*</span></label>
                <input type="text" name="title" class="form-control" value="{{ property.title }}" required>
            </div>
            <div class="form-group">
                <label>توضیحات</label>
                <textarea name="description" class="form-control" rows="5">{{ property.description }}</textarea>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>نوع اقامتگاه <span class="required-star">*</span></label>
                    <select name="property_type" class="form-control" required>
                        <option value="villa" {% if property.property_type == 'villa' %}selected{% endif %}>ویلا</option>
                        <option value="apartment" {% if property.property_type == 'apartment' %}selected{% endif %}>آپارتمان</option>
                        <option value="cottage" {% if property.property_type == 'cottage' %}selected{% endif %}>کلبه</option>
                        <option value="villa-garden" {% if property.property_type == 'villa-garden' %}selected{% endif %}>باغ ویلا</option>
                        <option value="penthouse" {% if property.property_type == 'penthouse' %}selected{% endif %}>پنت‌هاوس</option>
                        <option value="other" {% if property.property_type == 'other' %}selected{% endif %}>سایر</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>موقعیت <span class="required-star">*</span></label>
                    <input type="text" name="location" class="form-control" value="{{ property.location }}" required>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>قیمت هر شب (تومان) <span class="required-star">*</span></label>
                    <input type="number" name="price_per_night" class="form-control" value="{{ property.price_per_night }}" required min="0" step="1000">
                </div>
                <div class="form-group">
                    <label>حداکثر مهمان <span class="required-star">*</span></label>
                    <input type="number" name="max_guests" class="form-control" value="{{ property.max_guests }}" required min="1">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>اتاق خواب</label>
                    <input type="number" name="bedrooms" class="form-control" value="{{ property.bedrooms }}" min="0">
                </div>
                <div class="form-group">
                    <label>سرویس بهداشتی</label>
                    <input type="number" name="bathrooms" class="form-control" value="{{ property.bathrooms }}" min="0">
                </div>
            </div>
            <button type="submit" class="submit-btn">
                <i class="fas fa-save"></i> ذخیره تغییرات
            </button>
        </form>
    </div>
    <p class="text-center" style="margin-top:1.5rem;">
        <a href="/admin/properties" class="btn-ghost"><i class="fas fa-arrow-right"></i> بازگشت به لیست اقامتگاه‌ها</a>
    </p>
</div>
</main>

<footer class="main-footer">
    <div class="footer-bottom">
        <p>© ۱۴۰۴ جابامن — تمام حقوق محفوظ است.</p>
    </div>
</footer>

<script src="/static/js/main.js"></script>
</body>
</html>
