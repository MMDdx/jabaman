<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>علاقه‌مندی‌ها</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="catalog-container">
    <h1>علاقه‌مندی‌های شما</h1>
    <div class="property-grid">
        {% for item in items %}
        <div class="property-card">
            <div class="card-image"><img src="{{ item.image_url }}" alt="" style="width:100%;height:100%;object-fit:cover;"></div>
            <div class="card-body">
                <h3>{{ item.title }}</h3>
                <p class="card-location"><i class="fas fa-map-marker-alt"></i> {{ item.location }}</p>
                <div class="card-footer">
                    <span class="card-price">{{ item.price_per_night }} تومان</span>
                    <a href="/property/{{ item.id }}" class="card-btn">مشاهده</a>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
    <p><a href="/catalog">بازگشت به کاتالوگ</a></p>
</div>
</body>
</html>
