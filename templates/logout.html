<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خروج | جابامن</title>
    <link rel="icon" type="image/svg+xml" href="/static/images/favicon.svg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header class="main-header">
    <div class="header-container">
        <a href="/" class="logo">
            <img src="/static/images/logo.svg" class="logo-img" alt="جابامن">
        </a>
        <nav class="main-nav">
            <a href="/">خانه</a>
            <a href="/catalog">اقامتگاه‌ها</a>
            <a href="/contact">تماس با ما</a>
            <a href="/register" class="btn-outline btn-sm">ثبت‌نام</a>
            <a href="/login" class="btn-primary btn-sm">ورود</a>
        </nav>
    </div>
</header>

<main>
<div class="register-container" data-logout-trigger>
    <div class="page-header" style="text-align:center;">
        <h1>در حال خروج...</h1>
        <p>لطفاً چند لحظه صبر کنید.</p>
    </div>

    <div class="register-card" style="text-align:center;padding:3rem 2rem;">
        <i class="fas fa-spinner fa-spin" style="font-size:3rem;color:var(--primary);margin-bottom:1.5rem;"></i>
        <h2 style="margin-bottom:1rem;color:var(--text);">در حال پایان نشست</h2>
        <p style="color:var(--text-muted);margin-bottom:1.5rem;">
            اگر به‌طور خودکار منتقل نشدید، روی دکمه‌ی زیر کلیک کنید.
        </p>
        <a href="/" class="btn-primary">
            <i class="fas fa-home"></i> بازگشت به خانه
        </a>
    </div>

    <div class="site-footer">
        © ۱۴۰۴ جابامن — تمام حقوق محفوظ است.
    </div>
</div>
</main>

<!-- اسکریپت خارجی برای پاک‌کردن کوکی و ریدایرکت -->
<script src="/static/js/logout.js"></script>
<script src="/static/js/main.js"></script>
</body>
</html>
