<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نیاز به ورود | جابامن</title>
    <link rel="icon" type="image/svg+xml" href="/static/images/favicon.svg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header class="main-header">
    <div class="header-container">
        <a href="/" class="logo">
            <img src="/static/images/logo.svg" class="logo-img" alt="جابامن">
        </a>
        <nav class="main-nav">
            <a href="/">خانه</a>
            <a href="/catalog">اقامتگاه‌ها</a>
            <a href="/contact">تماس با ما</a>
            <a href="/register" class="btn-outline btn-sm">ثبت‌نام</a>
            <a href="/login" class="btn-primary btn-sm">ورود</a>
        </nav>
    </div>
</header>

<main>
<div class="register-container" data-login-redirect>
    <div class="page-header" style="text-align:center;">
        <h1>نیاز به ورود</h1>
        <p>برای دسترسی به این صفحه باید وارد حساب کاربری خود شوید.</p>
    </div>

    <div class="register-card" style="text-align:center;padding:3rem 2rem;">
        <i class="fas fa-lock" style="font-size:3rem;color:var(--accent);margin-bottom:1.5rem;"></i>
        <h2 style="margin-bottom:1rem;color:var(--text);">دسترسی محدود</h2>
        <p style="color:var(--text-muted);margin-bottom:1.5rem;">
            در حال انتقال به صفحه‌ی ورود... اگر منتقل نشدید، روی دکمه‌ی زیر کلیک کنید.
        </p>
        <a href="/login" class="btn-primary">
            <i class="fas fa-sign-in-alt"></i> ورود به حساب
        </a>
    </div>

    <div class="site-footer">
        © 1405 جابامن — تمام حقوق محفوظ است.
    </div>
</div>
</main>

<!-- ریدایرکت به صفحه ورود پس از ۲ ثانیه -->
<script src="/static/js/login_redirect.js"></script>
<script src="/static/js/main.js"></script>
</body>
</html>
