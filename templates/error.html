<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} | جابامن</title>
    <link rel="icon" type="image/svg+xml" href="/static/images/favicon.svg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="main-header">
    <div class="header-container">
        <a href="/" class="logo">
            <img src="/static/images/logo.svg" class="logo-img" alt="جابامن">
        </a>
        <nav class="main-nav">
            <a href="/">خانه</a>
            <a href="/catalog">اقامتگاه‌ها</a>
            <a href="/contact">تماس با ما</a>
            {% if user_id %}
            <a href="/cart"><i class="fas fa-shopping-cart"></i> سبد</a>
            <a href="/wishlist"><i class="fas fa-heart"></i> علاقه‌مندی</a>
            {% if is_admin %}<a href="/admin" class="btn-outline btn-sm"><i class="fas fa-tachometer-alt"></i> پنل مدیریت</a>{% endif %}
            <a href="/logout" class="btn-primary btn-sm">خروج</a>
            {% else %}
            <a href="/register" class="btn-outline btn-sm">ثبت‌نام</a>
            <a href="/login" class="btn-primary btn-sm">ورود</a>
            {% endif %}
        </nav>
    </div>
</header>

<main>
<div class="error-container">
    <div class="error-code">{{ code }}</div>
    <h1>{{ title }}</h1>
    <p>{{ description|safe }}</p>
    <div style="display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;">
        <a href="/" class="btn-primary">
            <i class="fas fa-home"></i> بازگشت به خانه
        </a>
        <a href="/catalog" class="btn-outline">
            <i class="fas fa-search"></i> مشاهده اقامتگاه‌ها
        </a>
    </div>
</div>
</main>

<footer class="main-footer">
    <div class="footer-bottom">
        <p>© ۱۴۰۴ جابامن — تمام حقوق محفوظ است.</p>
    </div>
</footer>

<script src="/static/js/main.js"></script>
</body>
</html>
