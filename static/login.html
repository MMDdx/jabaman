<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود | پلتفرم اجاره اقامتگاه</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="register-container">

    <div class="page-header">
        <h1>پلتفرم اجاره اقامتگاه</h1>
        <p>به حساب کاربری خود وارد شوید و رزرو یا میزبانی را ادامه دهید.</p>
    </div>

    <div class="register-card">
        <div class="register-header">
            <i class="fas fa-sign-in-alt"></i>
            <h2>ورود</h2>
        </div>

        <!-- باکس پیام خطا/موفقیت — به‌صورت پیش‌فرض مخفی است -->
        <div id="form-message" class="form-message" role="alert" aria-live="polite" style="display:none;"></div>

        <!-- فرم با action و method کلاسیک (به‌عنوان fallback اگر JS خاموش بود) -->
        <form class="register-form" id="login-form" action="/login" method="POST">

            <div class="form-group">
                <label for="email">ایمیل <span class="required-star">*</span></label>
                <input type="email" id="email" name="email" class="form-control"
                       placeholder="example@domain.com" required
                       autocomplete="email">
            </div>

            <div class="form-group">
                <label for="login-password">رمز عبور <span class="required-star">*</span></label>
                <input type="password" id="login-password" name="password" class="form-control"
                       placeholder="رمز عبور" required
                       autocomplete="current-password">
            </div>

            <div class="form-group">
                <div class="checkbox-group">
                    <input type="checkbox" id="remember-me" name="remember_me" value="1">
                    <label for="remember-me">مرا به خاطر بسپار</label>
                </div>
            </div>

            <button type="submit" class="submit-btn" id="submit-btn">
                <span id="btn-text">ورود</span>
                <i class="fas fa-chevron-left"></i>
            </button>

            <div class="login-link">
                حساب کاربری ندارید؟ <a href="/register">ثبت‌نام کنید</a>
            </div>
        </form>
    </div>

    <div class="site-footer">
        © ۲۰۲۵ پلتفرم اجاره اقامتگاه — تمام حقوق محفوظ است.
    </div>
</div>

<script>
(function () {
    "use strict";

    var form = document.getElementById("login-form");
    var msgBox = document.getElementById("form-message");
    var btn = document.getElementById("submit-btn");
    var btnText = document.getElementById("btn-text");

    function showMessage(text, type) {
        // type: "error" | "success" | "info"
        msgBox.textContent = text;
        msgBox.className = "form-message " + (type || "error");
        msgBox.style.display = "block";
        // اسکرول به بالای فرم برای دیدن پیام
        msgBox.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }

    function hideMessage() {
        msgBox.style.display = "none";
        msgBox.textContent = "";
    }

    function setLoading(isLoading) {
        if (isLoading) {
            btn.disabled = true;
            btnText.textContent = "در حال ورود...";
        } else {
            btn.disabled = false;
            btnText.textContent = "ورود";
        }
    }

    form.addEventListener("submit", function (e) {
        e.preventDefault();
        hideMessage();

        var formData = new FormData(form);

        // اعتبارسنجی سمت کلاینت (به‌عنوان بهینه‌سازی، قبل از ارسال به سرور)
        var email = (formData.get("email") || "").trim();
        var password = formData.get("password") || "";
        if (!email || !password) {
            showMessage("ایمیل و رمز عبور الزامی است.", "error");
            return;
        }

        setLoading(true);

        fetch("/login", {
            method: "POST",
            body: formData,
            headers: {
                "Accept": "application/json",
                "X-Requested-With": "XMLHttpRequest"
            },
            credentials: "same-origin"
        })
        .then(function (resp) {
            // حتی در پاسخ خطای 401 هم JSON برمی‌گردد
            return resp.json().then(function (data) {
                return { status: resp.status, data: data };
            });
        })
        .then(function (result) {
            var data = result.data || {};
            if (data.success) {
                showMessage("ورود موفقیت‌آمیز بود. در حال انتقال...", "success");
                var target = data.redirect || "/";
                setTimeout(function () {
                    window.location.href = target;
                }, 400);
            } else {
                showMessage(data.error || "خطای ناشناخته رخ داد.", "error");
                setLoading(false);
            }
        })
        .catch(function (err) {
            showMessage("ارتباط با سرور برقرار نشد. دوباره تلاش کنید.", "error");
            setLoading(false);
        });
    });
})();
</script>

</body>
</html>
