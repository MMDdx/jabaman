<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود | پلتفرم اجاره اقامتگاه</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="register-container">

    <div class="page-header">
        <h1>پلتفرم اجاره اقامتگاه</h1>
        <p>به حساب کاربری خود وارد شوید و رزرو یا میزبانی را ادامه دهید.</p>
    </div>

    <div class="register-card">
        <div class="register-header">
            <i class="fas fa-sign-in-alt"></i>
            <h2>ورود</h2>
        </div>

        <!-- باکس پیام خطا/موفقیت — توسط auth.js پر می‌شود -->
        <div id="form-message" class="form-message" role="alert" aria-live="polite" style="display:none;"></div>

        <!--
          ویژگی data-ajax-form باعث می‌شود auth.js این فرم را هندل کند.
          data-loading-text  : متن دکمه هنگام ارسال
          data-success-message : پیام موفقیت قبل از ریدایرکت
          data-success-redirect : مسیر ریدایرکت (در صورت موفقیت؛ سرور هم می‌تواند برگرداند)
        -->
        <form class="register-form"
              id="login-form"
              action="/login"
              method="POST"
              data-ajax-form
              data-loading-text="در حال ورود..."
              data-success-message="ورود موفقیت‌آمیز بود. در حال انتقال..."
              data-success-redirect="/">

            <div class="form-group">
                <label for="email">ایمیل <span class="required-star">*</span></label>
                <input type="email" id="email" name="email" class="form-control"
                       placeholder="example@domain.com" required
                       autocomplete="email">
            </div>

            <div class="form-group">
                <label for="login-password">رمز عبور <span class="required-star">*</span></label>
                <input type="password" id="login-password" name="password" class="form-control"
                       placeholder="رمز عبور" required
                       autocomplete="current-password">
            </div>

            <div class="form-group">
                <div class="checkbox-group">
                    <input type="checkbox" id="remember-me" name="remember_me" value="1">
                    <label for="remember-me">مرا به خاطر بسپار</label>
                </div>
            </div>

            <button type="submit" class="submit-btn">
                <span>ورود</span>
                <i class="fas fa-chevron-left"></i>
            </button>

            <div class="login-link">
                حساب کاربری ندارید؟ <a href="/register">ثبت‌نام کنید</a>
            </div>
        </form>
    </div>

    <div class="site-footer">
        © ۲۰۲۵ پلتفرم اجاره اقامتگاه — تمام حقوق محفوظ است.
    </div>
</div>

<!-- اسکریپت مشترک فرم‌های ورود/ثبت‌نام -->
<script src="/static/js/auth.js"></script>

</body>
</html>
