<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ثبت‌نام | پلتفرم اجاره اقامتگاه</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

<div class="register-container">

    <div class="page-header">
        <h1>پلتفرم اجاره اقامتگاه</h1>
        <p>با ایجاد حساب کاربری، رزرو اقامتگاه‌ها یا میزبانی از مهمانان ساده‌تر می‌شود.</p>
    </div>

    <div class="register-card">
        <div class="register-header">
            <i class="fas fa-user-plus"></i>
            <h2>فرم ثبت‌نام</h2>
        </div>

        <!-- باکس پیام خطا/موفقیت — به‌صورت پیش‌فرض مخفی است -->
        <div id="form-message" class="form-message" role="alert" aria-live="polite" style="display:none;"></div>

        <!-- فرم با action کلاسیک (fallback اگر JS خاموش بود) -->
        <form class="register-form" id="signup-form" action="/register" method="POST">

            <div class="form-row">
                <div class="form-group">
                    <label for="first-name">نام <span class="required-star">*</span></label>
                    <input type="text" id="first-name" name="first_name" class="form-control"
                           placeholder="مثال: علی" required>
                </div>
                <div class="form-group">
                    <label for="last-name">نام خانوادگی <span class="required-star">*</span></label>
                    <input type="text" id="last-name" name="last_name" class="form-control"
                           placeholder="مثال: محمدی" required>
                </div>
            </div>

            <div class="form-group">
                <label for="email">ایمیل <span class="required-star">*</span></label>
                <input type="email" id="email" name="email" class="form-control"
                       placeholder="example@domain.com" required
                       autocomplete="email">
            </div>

            <div class="form-group">
                <label for="phone">شماره موبایل (اختیاری)</label>
                <input type="tel" id="phone" name="phone" class="form-control"
                       placeholder="مثلاً: ۰۹۱۲۳۴۵۶۷۸۹" pattern="[0-9]{10,11}"
                       title="شماره موبایل باید ۱۰ یا ۱۱ رقم باشد">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="password">رمز عبور <span class="required-star">*</span></label>
                    <input type="password" id="password" name="password" class="form-control"
                           placeholder="حداقل ۸ کاراکتر" required minlength="8"
                           autocomplete="new-password">
                </div>
                <div class="form-group">
                    <label for="confirm-password">تکرار رمز عبور <span class="required-star">*</span></label>
                    <input type="password" id="confirm-password" name="confirm_password" class="form-control"
                           placeholder="تکرار رمز عبور" required minlength="8"
                           autocomplete="new-password">
                </div>
            </div>

            <div class="form-group">
                <label for="account-type">نوع حساب کاربری <span class="required-star">*</span></label>
                <select id="account-type" name="account_type" class="form-control" required>
                    <option value="" disabled selected>نقش خود را انتخاب کنید</option>
                    <option value="guest">مهمان (مسافر)</option>
                    <option value="host">میزبان (صاحب اقامتگاه)</option>
                </select>
            </div>

            <button type="submit" class="submit-btn" id="submit-btn">
                <span id="btn-text">ایجاد حساب کاربری</span>
                <i class="fas fa-chevron-left"></i>
            </button>

            <div class="login-link">
                قبلاً ثبت‌نام کرده‌اید؟ <a href="/login">وارد شوید</a>
            </div>
        </form>
    </div>

    <div class="site-footer">
        © ۲۰۲۵ پلتفرم اجاره اقامتگاه — تمام حقوق محفوظ است.
    </div>
</div>

<script>
(function () {
    "use strict";

    var form = document.getElementById("signup-form");
    var msgBox = document.getElementById("form-message");
    var btn = document.getElementById("submit-btn");
    var btnText = document.getElementById("btn-text");

    function showMessage(text, type) {
        msgBox.textContent = text;
        msgBox.className = "form-message " + (type || "error");
        msgBox.style.display = "block";
        msgBox.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }

    function hideMessage() {
        msgBox.style.display = "none";
        msgBox.textContent = "";
    }

    function setLoading(isLoading) {
        if (isLoading) {
            btn.disabled = true;
            btnText.textContent = "در حال ثبت‌نام...";
        } else {
            btn.disabled = false;
            btnText.textContent = "ایجاد حساب کاربری";
        }
    }

    form.addEventListener("submit", function (e) {
        e.preventDefault();
        hideMessage();

        var formData = new FormData(form);

        // اعتبارسنجی سمت کلاینت
        var email = (formData.get("email") || "").trim();
        var password = formData.get("password") || "";
        var confirm = formData.get("confirm_password") || "";
        var accountType = formData.get("account_type") || "";

        if (!formData.get("first_name") || !formData.get("last_name")) {
            showMessage("نام و نام خانوادگی الزامی است.", "error");
            return;
        }
        if (!email) {
            showMessage("ایمیل الزامی است.", "error");
            return;
        }
        if (password.length < 8) {
            showMessage("رمز عبور باید حداقل ۸ کاراکتر باشد.", "error");
            return;
        }
        if (password !== confirm) {
            showMessage("رمز عبور و تکرار آن مطابقت ندارند.", "error");
            return;
        }
        if (!accountType) {
            showMessage("نوع حساب کاربری را انتخاب کنید.", "error");
            return;
        }

        setLoading(true);

        fetch("/register", {
            method: "POST",
            body: formData,
            headers: {
                "Accept": "application/json",
                "X-Requested-With": "XMLHttpRequest"
            },
            credentials: "same-origin"
        })
        .then(function (resp) {
            return resp.json().then(function (data) {
                return { status: resp.status, data: data };
            });
        })
        .then(function (result) {
            var data = result.data || {};
            if (data.success) {
                showMessage("ثبت‌نام با موفقیت انجام شد. در حال انتقال به صفحه ورود...", "success");
                var target = data.redirect || "/login";
                setTimeout(function () {
                    window.location.href = target;
                }, 800);
            } else {
                showMessage(data.error || "خطای ناشناخته رخ داد.", "error");
                setLoading(false);
            }
        })
        .catch(function (err) {
            showMessage("ارتباط با سرور برقرار نشد. دوباره تلاش کنید.", "error");
            setLoading(false);
        });
    });
})();
</script>

</body>
</html>
