<?xml version="1.0" encoding="UTF-8"?>
<!-- Favicon موقت برای جابامن - حرف "ج" روی پس‌زمینه teal.
     این فایل را با لوگوی خود جایگزین کنید (هم نام logo.png و favicon.ico هم می‌توانید بگذارید). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#134E4A"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <text x="32" y="44" font-family="Tahoma, sans-serif" font-size="38" font-weight="bold"
        fill="#F97316" text-anchor="middle">ج</text>
</svg>
